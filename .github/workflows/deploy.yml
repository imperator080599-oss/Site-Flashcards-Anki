# Build et déploiement du site statique sur GitHub Pages.
#
# Les variables NEXT_PUBLIC_* sont publiques par conception (elles sont
# de toute façon incluses dans le bundle client). Aucun secret ici.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/anki-deck-ecommerce-9nko5v]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://imperator080599.github.io/Site-Flashcards-Anki
  NEXT_PUBLIC_BASE_PATH: /Site-Flashcards-Anki
  NEXT_PUBLIC_CONTACT_EMAIL: imperator080599@gmail.com
  # Valeurs publiques par conception (embarquées dans le bundle client).
  NEXT_PUBLIC_SUPABASE_URL: https://qgmtqxnopnffzcnigcpv.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnbXRxeG5vcG5mZnpjbmlnY3B2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjM1MjcsImV4cCI6MjA5OTUzOTUyN30.52VB2_oc-OO0n_J4eXzaM6NeWBvh6oAdt0TKmoaLI7k

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build (static export)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Vérifie que le backend répond comme attendu (états d'erreur contrôlés).
  smoke-backend:
    runs-on: ubuntu-latest
    steps:
      # Slug volontairement inexistant : vérifie que la fonction et la base
      # répondent (404 attendu, 503 tant que Stripe n'est pas configuré)
      # sans créer de session Stripe à chaque push.
      - name: create-checkout répond (404 slug inconnu, ou 503 avant Stripe)
        run: |
          code=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
            "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/create-checkout" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"deckSlug":"smoke-test-deck-inexistant","successUrl":"https://imperator080599.github.io/Site-Flashcards-Anki/merci/","cancelUrl":"https://imperator080599.github.io/Site-Flashcards-Anki/decks/"}')
          cat /tmp/r.json; echo
          [ "$code" = "404" ] || [ "$code" = "503" ] || { echo "Code inattendu: $code"; exit 1; }
      - name: download rejette un jeton invalide (400)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/download?token=abc")
          [ "$code" = "400" ] || { echo "Code inattendu: $code"; exit 1; }
      - name: download rejette un jeton inconnu (404)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/download?token=00000000-0000-4000-8000-000000000000")
          [ "$code" = "404" ] || { echo "Code inattendu: $code"; exit 1; }
      - name: confirm-order rejette une référence invalide (400, ou 503 avant Stripe)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/confirm-order" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"sessionId":"nope"}')
          [ "$code" = "400" ] || [ "$code" = "503" ] || { echo "Code inattendu: $code"; exit 1; }
      - name: stripe-webhook exige une signature valide (400/503)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/stripe-webhook" \
            -H "Content-Type: application/json" -d '{}')
          [ "$code" = "400" ] || [ "$code" = "503" ] || { echo "Code inattendu: $code"; exit 1; }
